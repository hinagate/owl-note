<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OWL-Note</title>
  <!-- Page favicon: the manifest icons only cover the toolbar/store — the tab icon and
       Chrome's "Create shortcut" desktop icon come from here. -->
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png" />
  <link rel="icon" type="image/png" sizes="128x128" href="icons/icon-128.png" />
  <link rel="stylesheet" href="katex.css" />
  <link rel="stylesheet" href="github.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="toolbar"></div>
  <div id="panes">
    <aside id="sidebar"></aside>
    <section id="note-list"></section>
    <main id="editor"></main>
  </div>
  <aside id="ask-panel" hidden></aside>
  <div id="toast" hidden></div>
  <!-- Vendored official mammoth (DOCX import) — separate file, not bundled, so it stays
       hash-matchable and its bluebird new Function code is isolated from app.js. -->
  <script src="mammoth.browser.min.js"></script>
  <!-- Untouched official PDF rasterizer — kept separate and hash-matchable for review. -->
  <script src="html2canvas.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
